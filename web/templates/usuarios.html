{% extends "layout.html" %}

{% block content %}
<h1>👥 Usuarios</h1>

<div class="card form-card">
    <h3>➕ Crear usuario</h3>

    <form method="post" action="/usuarios/crear" class="formulario">
        <input type="text" name="username" placeholder="Usuario" required>
        <input type="text" name="password" placeholder="Contraseña" required>

        <select name="rol" required>
            <option value="user">Usuario</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">Crear usuario</button>
    </form>
</div>

{% if usuarios %}
<table class="tabla">
    <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Contraseña</th>
        <th>Rol</th>
        <th>Acciones</th>
    </tr>

    {% for u in usuarios %}
    <tr>
        <td>{{ u[0] }}</td>
        <td>{{ u[1] }}</td>
        <td>{{ u[2] }}</td>
        <td>{{ u[3] }}</td>
        <td>
            <a class="btn eliminar" href="/usuarios/eliminar/{{ u[0] }}">🗑 Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No hay usuarios registrados.</p>
{% endif %}
{% endblock %}
